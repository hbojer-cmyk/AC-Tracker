<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title>High-Definition Event Icons Inspection</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b111e; color: #f1f5f9; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .card { background: #131d2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; text-align: center; }
  .previews { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 12px; }
  .bg-dark { background: #070c14; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .bg-light { background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; }
  .label { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .file { font-size: 11px; font-mono; color: #94a3b8; }
</style>
</head>
<body>
<h1>High-Definition 3D Event Icons Preview</h1>
<div class='grid'>

  <div class='card'>
    <div class='label'>Dark Skies (Active Live Event)</div>
    <div class='file'>darkskies.png</div>
    <div class='previews'>
      <div class='bg-dark'>
        <div style='color: #64748b; font-size: 10px; margin-bottom: 4px;'>Dark (48px & 24px)</div>
        <img src='darkskies.png' width='48' height='48' style='vertical-align: middle; margin-right: 8px;' />
        <img src='darkskies.png' width='24' height='24' style='vertical-align: middle;' />
      </div>
      <div class='bg-light'>
        <div style='color: #64748b; font-size: 10px; margin-bottom: 4px;'>Light (48px & 24px)</div>
        <img src='darkskies.png' width='48' height='48' style='vertical-align: middle; margin-right: 8px;' />
        <img src='darkskies.png' width='24' height='24' style='vertical-align: middle;' />
      </div>
    </div>
    <div style='margin-top: 12px;'>
      <img src='darkskies.png' width='140' height='140' style='filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));' />
    </div>
  </div>
    
  <div class='card'>
    <div class='label'>Riding the Comet</div>
    <div class='file'>ridingthecomet.png</div>
    <div class='previews'>
      <div class='bg-dark'>
        <div style='color: #64748b; font-size: 10px; margin-bottom: 4px;'>Dark (48px & 24px)</div>
        <img src='ridingthecomet.png' width='48' height='48' style='vertical-align: middle; margin-right: 8px;' />
        <img src='ridingthecomet.png' width='24' height='24' style='vertical-align: middle;' />
      </div>
      <div class='bg-light'>
        <div style='color: #64748b; font-size: 10px; margin-bottom: 4px;'>Light (48px & 24px)</div>
        <img src='ridingthecomet.png' width='48' height='48' style='vertical-align: middle; margin-right: 8px;' />
        <img src='ridingthecomet.png' width='24' height='24' style='vertical-align: middle;' />
      </div>
    </div>
    <div style='margin-top: 12px;'>
      <img src='ridingthecomet.png' width='140' height='140' style='filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));' />
    </div>
  </div>
    
</div>
</body>
</html>
